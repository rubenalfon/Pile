name: Build and Release FOSS APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build FOSS Release APK
        run: ./gradlew :app:assembleFossRelease --no-daemon

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > /tmp/keystore.jks
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(ls -d $SDK_PATH/build-tools/* | sort -V | tail -n 1)
          
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VERSION="${TAG_NAME#v}"
          APK_NAME="Pile-foss-v${CLEAN_VERSION}.apk"
          
          $BUILD_TOOLS/apksigner sign \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --ks /tmp/keystore.jks \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "/tmp/$APK_NAME" \
            app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          
          rm /tmp/keystore.jks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: /tmp/Pile-foss-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}